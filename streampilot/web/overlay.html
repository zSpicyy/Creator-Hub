<!doctype html>
<html><head><meta charset="utf-8"><title>StreamPilot Overlay</title>
<style>
html,body{margin:0;background:transparent;font-family:"Segoe UI",system-ui,sans-serif;color:#fff;overflow:hidden}
.goal{margin:10px;padding:12px 16px;border-radius:14px;background:rgba(14,12,24,.82);box-shadow:0 4px 18px rgba(0,0,0,.35);max-width:620px}
.goal .t{display:flex;justify-content:space-between;font-weight:800;font-size:22px;margin-bottom:8px;text-shadow:0 2px 3px #0008}
.goal .t span:last-child{font-variant-numeric:tabular-nums}
.bar{height:22px;border-radius:11px;background:rgba(255,255,255,.14);overflow:hidden}
.fill{height:100%;border-radius:11px;transition:width .9s cubic-bezier(.2,.9,.2,1);box-shadow:0 0 14px currentColor}
.goal.done .fill{animation:pulse 1.2s ease-in-out 4}
@keyframes pulse{50%{filter:brightness(1.5)}}
.win{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.win .card{background:rgba(14,12,24,.9);border:3px solid #7c4dff;border-radius:22px;padding:26px 44px;text-align:center;box-shadow:0 0 40px #7c4dffaa;transform:scale(.6);opacity:0;transition:all .45s cubic-bezier(.2,1.4,.4,1)}
.win.show .card{transform:scale(1);opacity:1}
.win small{display:block;font-size:22px;opacity:.8;font-weight:600}
.win b{display:block;font-size:64px;font-weight:900;margin:6px 0;text-shadow:0 0 18px #7c4dff}
.roll{font-size:40px;font-weight:800;opacity:.85}
.q{margin:10px;padding:12px 16px;border-radius:14px;background:rgba(14,12,24,.82);max-width:360px}
.q h3{margin:0 0 6px;font-size:20px}.q ol{margin:0;padding-left:26px;font-size:19px;line-height:1.45}.q .now{color:#3ddc84;font-weight:700;margin-bottom:6px}
.q .closed{opacity:.7;font-size:15px}
</style></head><body>
<div id="root"></div>
<div class="win" id="win"><div class="card"><small id="wt"></small><b id="wn"></b></div></div>
<script>
const P=new URLSearchParams(location.search),W=P.get('w')||'all',GID=P.get('id');let S=null;
const de=()=>!S||S.lang==='de',T=(a,b)=>de()?a:b;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){S=await fetch('state').then(r=>r.json());draw()}
function draw(){const r=document.getElementById('root');let h='';
 if(W==='goal'&&S.on.goal){(S.goals||[]).filter(g=>g.on&&(!GID||g.id===GID)).forEach(g=>{const p=g.target>0?Math.min(100,g.current/g.target*100):0;
  h+=`<div class="goal ${g.current>=g.target&&g.target>0?'done':''}"><div class="t"><span>${esc(g.title)}</span><span>${g.current} / ${g.target}</span></div><div class="bar"><div class="fill" style="width:${p}%;background:${esc(g.color||'#7c4dff')};color:${esc(g.color||'#7c4dff')}"></div></div></div>`})}
 if(W==='queue'&&S.on.queue){const q=S.queue;h=`<div class="q"><h3>${T('Mitspieler','Players')}</h3>${(q.playing||[]).length?`<div class="now">${T('Jetzt dran','Now playing')}: ${q.playing.map(e=>esc(e.display)).join(', ')}</div>`:''}
  ${(q.list||[]).length?`<ol>${q.list.slice(0,8).map(e=>`<li>${esc(e.display)}</li>`).join('')}</ol>`:''}${q.open?'':`<div class="closed">${T('Warteschlange geschlossen','Queue closed')}</div>`}</div>`}
 r.innerHTML=h}
const audio={};function play(d){if(W!=='sound'&&W!=='all')return;if(d.where!=='obs')return;const a=new Audio('snd/'+encodeURIComponent(d.file));a.volume=Math.max(0,Math.min(1,d.vol));a.play().catch(()=>{})}
let wTimer;function winner(d){if(W!=='give'&&W!=='all')return;const w=document.getElementById('win'),n=document.getElementById('wn'),t=document.getElementById('wt');
 t.textContent=d.title?T('Gewinner: ','Winner: ')+d.title:T('Gewinner','Winner');const pool=(d.names||[]).concat([d.user]);let i=0;w.classList.add('show');clearTimeout(wTimer);
 const spin=()=>{if(i<22){n.textContent=pool[Math.floor(Math.random()*pool.length)];n.className='roll';i++;setTimeout(spin,60+i*9)}else{n.textContent=d.user;n.className='';wTimer=setTimeout(()=>w.classList.remove('show'),9000)}};spin()}
function connect(){const es=new EventSource('live');es.onmessage=e=>{const m=JSON.parse(e.data);if(m.kind==='state')load();if(m.kind==='sound')play(m.data);if(m.kind==='winner')winner(m.data)};es.onerror=()=>{es.close();setTimeout(connect,3000)}}
load();connect();setInterval(load,30000);
</script></body></html>
