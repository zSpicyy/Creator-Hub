# Veröffentlicht eine neue Version: Claude lädt die fertigen, signierten Dateien in einen Zweig
# „upload/v<version>“ hoch. Diese Automatik macht daraus ein Release und löscht den Zweig wieder.
name: Release veröffentlichen
on:
  push:
    branches: ['upload/**']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME#upload/}"
          cd release
          # Sicherheitsnetz: nie einen Schlüssel veröffentlichen
          if ls | grep -qi '\.key$'; then echo "Schlüssel gefunden – Abbruch"; exit 1; fi
          test -f latest.json
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main \
            --title "Creator Hub ${TAG#v}" --notes-file NOTES.md --latest \
            latest.json $(ls | grep -v -e '^NOTES.md$' -e '^latest.json$')
      - name: Upload-Zweig löschen
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push origin --delete "$GITHUB_REF_NAME" || true
