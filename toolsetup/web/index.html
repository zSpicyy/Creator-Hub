<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Setup</title>
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="/kit/kit.css">
<link rel="stylesheet" href="/kit/polish.css">
<style>
body{display:block;overflow:hidden}
.wrap{height:100vh;display:flex;flex-direction:column}
.pv{height:190px;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--c) 55%,transparent),color-mix(in srgb,var(--c) 14%,var(--panel2)) 72%)}
.pv img{width:112px;height:112px;filter:drop-shadow(0 10px 22px color-mix(in srgb,var(--c) 70%,#000))}
.body{flex:1;padding:24px 30px;display:flex;flex-direction:column}
h1{margin:0 0 6px;font-size:22px}p{color:var(--muted);margin:0 0 16px}
.opt{display:flex;align-items:center;gap:10px;margin:4px 0 18px;cursor:pointer}
.opt input{width:18px;height:18px;accent-color:var(--c)}
.where{font-size:12px;color:var(--muted);margin-bottom:14px;word-break:break-all}
.sp{flex:1}
.bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,var(--panel2));overflow:hidden;margin:6px 0 6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 55%,#fff));transition:width .3s ease}
.btn.primary{background:var(--c);border-color:var(--c);color:#fff}
.note{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--muted);margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap" translate="no"><div class="pv"><img src="logo.svg" alt=""></div><div class="body" id="b"></div></div>
<script src="/kit/kit.js"></script>
<script>
const {$,esc,api}=Kit;let S=null,t=null;const de=()=>Kit.lang==='de',T=(a,b)=>de()?a:b;
function view(){const b=$('#b');document.documentElement.style.setProperty('--c',S.color);document.title=S.title+T(' installieren',' setup');
 const extra=S.need.startsWith('ai:')?T(' Die KI wird automatisch mit eingerichtet.',' The AI is set up automatically.'):S.need==='ffmpeg'?T(' Das Video- und Tonmodul (ffmpeg) wird automatisch mit eingerichtet.',' The video and audio module (ffmpeg) is set up automatically.'):'';
 if(S.phase==='start')b.innerHTML=`<h1>${esc(S.title)} ${T('installieren','setup')}</h1><p>${T('Version','Version')} ${esc(S.version)}. ${T('Läuft ohne den Creator Hub und aktualisiert sich selbst.','Runs without Creator Hub and updates itself.')}${extra}</p>
  <label class="opt"><input type="checkbox" id="desk" checked>${T('Verknüpfung auf dem Desktop','Desktop shortcut')}</label><div class="where">${T('Wird installiert nach:','Installs to:')} ${esc(S.dir)}</div><div class="sp"></div><button class="btn primary big" id="go">${T('Installieren','Install')}</button>`;
 else if(S.phase==='copy'||S.phase==='need')b.innerHTML=`<h1>${T('Wird installiert …','Installing …')}</h1><p>${esc(S.text)}</p><div class="bar"><i style="width:${Math.round(S.done*100)}%"></i></div><small class="muted">${Math.round(S.done*100)} %</small><div class="sp"></div>`;
 else if(S.phase==='done')b.innerHTML=`<h1>${T('Fertig','Done')}</h1><p>${esc(S.title)} ${T('ist installiert. Du findest es im Startmenü.','is installed. You’ll find it in the Start menu.')}</p>${S.note?`<div class="note">${esc(S.note)}</div>`:''}<div class="sp"></div><button class="btn primary big" id="launch">${esc(S.title)} ${T('starten','start')}</button>`;
 else b.innerHTML=`<h1>${T('Das hat nicht geklappt','That didn’t work')}</h1><p class="err">${esc(S.error)}</p><div class="sp"></div><button class="btn primary big" id="go">${T('Nochmal versuchen','Try again')}</button>`}
async function load(){S=await api('api/state');view()}
document.addEventListener('click',async e=>{
 if(e.target.closest('#go')){const d=$('#desk');await api('api/install',{desktop:d?d.checked:true});clearInterval(t);t=setInterval(async()=>{await load();if(S.phase==='done'||S.phase==='error')clearInterval(t)},400);return}
 if(e.target.closest('#launch'))return api('api/launch',{});
});
load();
</script>
</body>
</html>
