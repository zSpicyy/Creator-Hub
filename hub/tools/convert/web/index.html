<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dateityp-Umwandler</title>
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="/kit/kit.css">
<style>
.wrap{max-width:900px}
.fi{width:34px;height:34px;border-radius:8px;background:var(--panel2);color:var(--accent);display:grid;place-items:center;font-size:17px;flex:none}
.line .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.line>.fi+div{flex:1;min-width:0}
.x{background:none;border:0;color:var(--muted);padding:6px 9px;border-radius:7px}.x:hover{background:var(--panel2);color:var(--danger)}
.grp{margin-bottom:12px}.grp>small{display:block;color:var(--muted);margin-bottom:6px}
.fmts{display:flex;flex-wrap:wrap;gap:7px}.fmts .btn{min-width:72px}.fmts .btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.note{color:var(--muted);font-size:13px;min-height:19px}
.mini-bar{width:120px}
.btn.sm{padding:4px 10px;font-size:12.5px}.btn.sm svg{width:14px;height:14px}.dl{margin-left:10px}
.acts2{display:flex;gap:8px;flex-wrap:wrap}.dlok{color:var(--muted);font-size:13px;margin-top:10px;display:flex;align-items:center;gap:8px}.okc{white-space:nowrap}.mini-bar .bar{margin:0}
</style>
<link rel="stylesheet" href="/kit/polish.css">
</head>
<body>
<header class="top"><div class="brand"><img src="logo.svg" alt="">Dateityp-Umwandler</div><div class="sp"></div><button class="btn primary" id="pick"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Dateien hinzufügen</button></header>
<nav>
  <button data-page="new"><svg viewBox="0 0 24 24"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>Umwandeln</button>
  <button data-page="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Verlauf</button>
  <div class="sp"></div><small>Dateien kannst du auch einfach ins Fenster ziehen.</small>
</nav>
<main id="main"></main>
<script src="/kit/i18n.js"></script>
<script src="/kit/kit.js"></script>
<script>
const {$,esc,api,size,base,num}=Kit;
const ICON={audio:'<svg viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>',
 video:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10.5 5-3v9l-5-3z"/></svg>',
 image:'<svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.7"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg>',
 unknown:'<svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>'};
const KIND={audio:'Musik / Ton',video:'Video',image:'Bild',unknown:'Unbekannt'};
const CAT={audio:'Musik / Ton',video:'Video',image:'Bild'};
let lastDl='',S=null,page='new',curId=null,files=[],target='',quality='medium',outDir='',timer=null;

function dur(s){s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')} Std.`:`${m}:${String(x).padStart(2,'0')} Min.`}
function describe(f){if(f.err)return f.err;const p=[KIND[f.kind]];if(f.w)p.push(`${num(f.w)} × ${num(f.h)}`);if(f.dur&&f.kind!=='image')p.push(dur(f.dur));if(f.size)p.push(size(f.size));return p.join(' · ')}
function nav(){document.querySelectorAll('nav [data-page]').forEach(b=>b.classList.toggle('on',b.dataset.page===page||(page==='batch'&&b.dataset.page==='history')))}
async function load(){S=await api('api/state')}

function setupSec(){const e=S.engine;if(e.ready)return'';
 return`<div class="sec" style="border-color:var(--accent)"><h3>Einmalig einrichten</h3><div class="line"><div>Umwandlungs-Programm laden<small>Zum Umwandeln braucht die App das kostenlose Programm ffmpeg (etwa 80 MB). Es wird einmal geladen, auf Echtheit geprüft und bleibt dann auf deinem PC.</small>
 ${e.loading?`<div class="bar"><i style="width:${Math.round(e.done*100)}%"></i></div>`:''}${e.error?`<small class="err">${esc(e.error)}</small>`:''}</div>${e.loading?`<span class="muted">${Math.round(e.done*100)} %</span>`:'<button class="btn primary" id="install">Einrichten</button>'}</div></div>`}

function okKinds(){return [...new Set(files.filter(f=>!f.err).map(f=>f.kind))]}
function allowed(f){const ks=okKinds();if(!ks.length)return false;return ks.every(k=>k==='unknown'||(k==='audio'?f.cat==='audio':k==='video'?true:f.cat==='image'||f.id==='gif'))||ks.some(k=>k==='video')&&f.cat==='audio'&&ks.every(k=>k!=='image')}

function viewNew(){page='new';nav();
 if(!files.length){$('#main').innerHTML=`${setupSec()}<div class="start"><div class="hero"><div class="pv" style="--c:#1fc4b8"><img src="logo.svg" alt=""></div><div class="body"><h2>Dateien umwandeln</h2><p>Ziehe Videos, Musik oder Bilder in dieses Fenster und wähle das neue Format. Die Originale bleiben unverändert.</p><div class="acts"><button class="btn primary" id="pick2">Dateien hinzufügen</button></div><div class="hint">Beliebig viele Dateien auf einmal. Sie werden gleichzeitig umgewandelt und lassen sich danach direkt herunterladen.</div></div></div></div>`;return}
 const fs=S.formats.filter(allowed);if(target&&!fs.some(f=>f.id===target))target='';
 const groups=['video','audio','image'].map(c=>({c,f:fs.filter(x=>x.cat===c)})).filter(g=>g.f.length);
 const tf=S.formats.find(f=>f.id===target);const ok=files.filter(f=>!f.err).length;
 const m=$('#main'),sc=m.scrollTop;
 m.innerHTML=`<div class="wrap">${setupSec()}<div class="head"><h2>Umwandeln</h2><span>${files.length===1?'1 Datei':files.length+' Dateien'}</span><button class="btn" id="clear">Alle entfernen</button></div>
 <div class="sec"><h3>Dateien</h3>${files.map((f,i)=>`<div class="line"><span class="fi">${ICON[f.kind]||ICON.unknown}</span><div><span class="name" title="${esc(f.path)}">${esc(base(f.path))}</span><small class="${f.err?'err':''}">${esc(describe(f))}</small></div><button class="x" data-rm="${i}" title="Diese Datei entfernen">Entfernen</button></div>`).join('')}</div>
 <div class="sec"><h3>Neues Format</h3>${groups.map(g=>`<div class="grp"><small>${CAT[g.c]}</small><div class="fmts">${g.f.map(f=>`<button class="btn ${target===f.id?'on':''}" data-t="${f.id}">${esc(f.label)}</button>`).join('')}</div></div>`).join('')||'<div class="empty">Für diese Dateien gibt es kein gemeinsames Format. Wandle Bilder und Videos getrennt um.</div>'}
  <div class="note">${tf?esc(tf.label)+': '+esc(tf.note||''):'Klicke auf das Format, das du haben möchtest.'}</div></div>
 <div class="sec"><h3>Einstellungen</h3>
  <div class="line"><div>Qualität<small>${quality==='high'?'So nah am Original wie möglich, größere Dateien.':quality==='small'?'Möglichst kleine Dateien, etwas weniger Qualität.':'Gute Qualität bei normaler Dateigröße.'}</small></div><div class="seg" id="qual" style="min-width:300px"><button class="btn ${quality==='high'?'on':''}" data-q="high">Beste</button><button class="btn ${quality==='medium'?'on':''}" data-q="medium">Normal</button><button class="btn ${quality==='small'?'on':''}" data-q="small">Klein</button></div></div>
  <div class="line"><div>Speichern in<small title="${esc(outDir)}">${outDir?esc(outDir):'Im selben Ordner wie die Originaldatei'}</small></div>${outDir?'<button class="btn" id="resetdir">Zurücksetzen</button>':''}<button class="btn" id="pickdir">Ändern</button></div></div>
 <button class="btn primary big" id="go" ${S.engine.ready&&target&&ok?'':'disabled'}>${ok===1?'Datei':ok+' Dateien'} umwandeln${tf?' in '+esc(tf.label):''}</button><p class="err" id="err"></p></div>`;
 m.scrollTop=sc}

async function addFiles(paths){const known=new Set(files.map(f=>f.path));paths=paths.filter(p=>!known.has(p));if(!paths.length)return;
 files=files.concat(paths.map(p=>({path:p,kind:'unknown',size:0})));viewNew();
 const info=await api('api/probe',{files:paths});for(const i of info){const f=files.find(x=>x.path===i.path);if(f)Object.assign(f,i)}viewNew()}
Kit.onDrop(paths=>addFiles(paths));

function viewHistory(){page='history';nav();
 $('#main').innerHTML=`<div class="head"><h2>Verlauf</h2><span>${S.batches.length} Umwandlungen</span></div><div class="pgrid">${S.batches.map(b=>`<button class="proj" data-id="${b.id}"><div class="th"><img src="api/img?id=${b.id}" alt="" style="width:100%;height:100%;object-fit:cover;opacity:1" onerror="this.onerror=null;this.src='logo.svg';this.style.cssText='width:72px;height:72px;opacity:.9'"></div><div class="tx"><div class="tr"><b>${esc(b.name)}</b><em class="tag">${b.items?b.items.length:1} ${(b.items&&b.items.length===1)?'Datei':'Dateien'}</em></div><span>${b.running?'Läuft gerade':esc(b.detail)}</span><i class="open">Öffnen</i></div><span class="del" data-del="${b.id}">Entfernen</span></button>`).join('')||'<div class="empty">Noch nichts umgewandelt.</div>'}</div>`}

function viewBatch(){const b=S.batches.find(x=>x.id===curId);if(!b)return viewHistory();page='batch';nav();
 const done=b.items.filter(i=>i.status==='done').length,err=b.items.filter(i=>i.status==='error').length;
 const tot=b.items.filter(i=>i.status!=='skipped').length||1;
 const prog=b.items.reduce((s,i)=>s+(i.status==='done'?1:i.status==='running'?i.pct:0),0)/tot;
 const f=S.formats.find(x=>x.id===b.target);
 const st=(i,k)=>i.status==='done'?`<span class="okc">Fertig</span><button class="btn sm dl" data-dl="${k}" title="In den Downloads-Ordner speichern"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Herunterladen</button>`:i.status==='running'?`<div class="mini-bar"><div class="bar"><i style="width:${Math.round(i.pct*100)}%"></i></div></div>`:i.status==='waiting'?'<span class="muted">Wartet</span>':`<span class="${i.status==='error'?'err':'muted'}">${esc(i.msg||'Übersprungen')}</span>`;
 $('#main').innerHTML=`<div class="wrap"><div class="head"><h2>${esc(b.name)}</h2><span>in ${esc(f?.label||b.target)} · ${b.running?Math.round(prog*100)+' %':`${done} von ${b.items.length} fertig${err?`, ${err} mit Fehler`:''}`}</span>${b.running?'<button class="btn danger" id="cancel">Abbrechen</button>':''}</div>
 ${b.running?`<div class="bar" style="margin-bottom:14px"><i style="width:${Math.round(prog*100)}%"></i></div>`:''}
 <div class="sec"><h3>Dateien</h3>${b.items.map((i,k)=>`<div class="line"><div><span class="name" title="${esc(i.src)}">${esc(base(i.src))}</span><small>${i.inBytes?size(i.inBytes):''}${i.outBytes?' → '+size(i.outBytes):''}</small></div>${st(i,k)}</div>`).join('')}</div>
 ${done?`<div class="acts2">${done>1?`<button class="btn primary" id="dlall"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Alle herunterladen (ZIP)</button>`:''}${!b.running?`<button class="btn" id="showres" data-p="${esc(b.items.find(i=>i.status==='done').out)}">Im Ordner zeigen</button>`:''}</div>`:''}
 ${lastDl?`<p class="dlok">Gespeichert in Downloads: <b>${esc(base(lastDl))}</b> <button class="btn sm" id="showdl">Anzeigen</button></p>`:''}</div>`}

function poll(id){clearInterval(timer);timer=setInterval(async()=>{await load();if(page==='batch'&&curId===id)viewBatch();const b=S.batches.find(x=>x.id===id);if(!b||!b.running)clearInterval(timer)},700)}

document.addEventListener('click',async e=>{const t=e.target;let el;
 try{
 if(t.closest('#pick')||t.closest('#pick2'))return addFiles(await Kit.pick('files'));
 if(el=t.closest('[data-del]')){e.stopPropagation();await api('api/delete?id='+el.dataset.del);await load();return viewHistory()}
 if(el=t.closest('[data-page]')){clearInterval(timer);await load();return el.dataset.page==='new'?viewNew():viewHistory()}
 if(el=t.closest('.proj')){curId=el.dataset.id;lastDl='';viewBatch();const b=S.batches.find(x=>x.id===curId);if(b&&b.running)poll(curId);return}
 if(t.closest('#install')){await api('api/engine/install',{});const iv=setInterval(async()=>{await load();if(page==='new')viewNew();if(!S.engine.loading)clearInterval(iv)},500);return}
 if(t.closest('#clear')){files=[];return viewNew()}
 if(el=t.closest('[data-rm]')){files.splice(+el.dataset.rm,1);return viewNew()}
 if(el=t.closest('[data-t]')){target=el.dataset.t;return viewNew()}
 if(el=t.closest('#qual button')){quality=el.dataset.q;return viewNew()}
 if(t.closest('#pickdir')){const p=await Kit.pick('folder');if(p[0]){outDir=p[0];viewNew()}return}
 if(t.closest('#resetdir')){outDir='';return viewNew()}
 if(t.closest('#go')){const r=await api('api/convert',{files:files.filter(f=>!f.err).map(f=>f.path),target,quality,outDir});curId=r.id;lastDl='';files=[];await load();viewBatch();poll(r.id);return}
 if(el=t.closest('[data-dl]')){el.disabled=true;const r=await api(`api/download?id=${curId}&i=${el.dataset.dl}`,{});lastDl=r.path;Kit.toast(Kit.t('In den Downloads-Ordner gespeichert.'));return viewBatch()}
 if(el=t.closest('#dlall')){el.disabled=true;const r=await api(`api/download?id=${curId}&zip=1`,{});lastDl=r.path;Kit.toast(Kit.t('ZIP-Datei im Downloads-Ordner gespeichert.'));return viewBatch()}
 if(t.closest('#showdl'))return Kit.openFolder(lastDl);
 if(t.closest('#cancel'))return api('api/cancel?id='+curId,{});
 if(el=t.closest('#showres'))return Kit.openFolder(el.dataset.p);
 }catch(x){const er=$('#err');if(er)er.textContent=x.message;else Kit.toast(x.message)}
});
load().then(viewNew);
// Rückgängig/Wiederholen: Dateiliste, Zielformat, Qualität, Zielordner
const UH={u:[],r:[],last:null,busy:false};
const ustate=()=>JSON.stringify({files,target,quality,outDir});
function urec(){if(UH.busy)return;const s=ustate();if(UH.last!==null&&s!==UH.last){UH.u.push(UH.last);if(UH.u.length>200)UH.u.shift();UH.r=[]}UH.last=s}
setInterval(()=>{if(page==='new')urec()},300);
function uapply(s){UH.busy=true;const o=JSON.parse(s);files=o.files;target=o.target;quality=o.quality;outDir=o.outDir;UH.last=s;viewNew();UH.busy=false}
function undo(){urec();if(!UH.u.length)return Kit.toast(Kit.t('Nichts zum Rückgängigmachen.'));UH.r.push(UH.last);uapply(UH.u.pop())}
function redo(){if(!UH.r.length)return;UH.u.push(UH.last);uapply(UH.r.pop())}
const HK=Kit.hotkeys('convert',[
 ['undo','Bearbeiten','Rückgängig',['Ctrl+Z'],undo],['redo','Bearbeiten','Wiederholen',['Ctrl+Y','Ctrl+Shift+Z'],redo],
 ['open','Datei','Dateien hinzufügen',['Ctrl+O'],async()=>{if(page!=='new')viewNew();addFiles(await Kit.pick('files'))}],
 ['go','Datei','Umwandeln starten',['Ctrl+Enter'],()=>{const b=$('#go');if(b&&!b.disabled)b.click()}],
 ['clear','Bearbeiten','Liste leeren',['Ctrl+Del'],()=>{if(page==='new'){files=[];viewNew()}}],
 ['hist','Ansicht','Verlauf',['Ctrl+H'],async()=>{clearInterval(timer);await load();viewHistory()}],
 ['new','Ansicht','Neue Umwandlung',['Ctrl+N'],async()=>{clearInterval(timer);await load();viewNew()}],
 ['keys','Hilfe','Tastenkürzel',['F1'],()=>HK.editor()]]);
if(location.hash==='#keys')setTimeout(()=>HK.editor(),300);
</script>
</body>
</html>
