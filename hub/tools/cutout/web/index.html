<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hintergrund-Entferner</title>
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="/kit/kit.css">
<style>
.work{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media(max-width:1050px){.work{grid-template-columns:1fr}}
.checker{background-color:#2a2a30;background-image:linear-gradient(45deg,#3a3a42 25%,transparent 25%,transparent 75%,#3a3a42 75%),linear-gradient(45deg,#3a3a42 25%,transparent 25%,transparent 75%,#3a3a42 75%);background-size:20px 20px;background-position:0 0,10px 10px}
.stage{position:relative;height:calc(100vh - 250px);min-height:340px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--panel2);touch-action:none;user-select:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage .wait{position:absolute;inset:0;display:none;place-items:center;background:#0008;color:#fff;font-weight:600;text-align:center;padding:20px}
.stage.busy .wait{display:grid}
.stage .wait .bar{width:240px;margin:12px auto 0}
.stage .tag{position:absolute;left:10px;top:10px;padding:4px 10px;border-radius:7px;background:#000b;color:#fff;font-size:12px;pointer-events:none}
.tbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}.tbar .ur{display:flex;gap:6px;flex:none}#szl{white-space:nowrap;display:flex;align-items:center;gap:8px}
.tbar .seg .btn{display:inline-flex;align-items:center;gap:7px}
.tbar .seg .btn svg{width:16px;height:16px}
.tbar .grow{flex:1}
.tbar label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.tbar input[type=range]{width:120px}
.hintline{color:var(--muted);font-size:13px;margin-top:8px;min-height:20px}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.sw{width:38px;height:38px;border-radius:10px;border:2px solid var(--line);cursor:pointer;padding:0;position:relative;overflow:hidden}
.sw.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sw input{position:absolute;inset:-6px;width:60px;height:60px;opacity:0;cursor:pointer}
.sw.pick{background:conic-gradient(#f44,#fa0,#fe3,#4d4,#3cf,#66f,#e4e,#f44)}
.proj .th.checker{background-size:contain,contain,20px 20px,20px 20px;background-repeat:no-repeat,no-repeat,repeat,repeat}
.pth{position:relative;aspect-ratio:16/10;border-radius:10px 10px 0 0;overflow:hidden}
.pth img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.pth .st{position:absolute;left:8px;bottom:8px;background:#000c;color:#fff;font-size:12px;padding:3px 9px;border-radius:99px}
.res{border-color:var(--ok)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bcur{position:absolute;left:0;top:0;border-radius:50%;pointer-events:none;border:1.5px solid #6dffb0;box-shadow:0 0 0 1.5px #000a,inset 0 0 0 1px #000a;will-change:transform;z-index:3}
.bcur.del{border-color:#ff7a9a}
</style>
<link rel="stylesheet" href="/kit/polish.css">
</head>
<body>
<header class="top"><div class="brand"><img src="logo.svg" alt="">Hintergrund-Entferner</div><div class="sp"></div><button class="btn primary" id="pick"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Bilder öffnen</button></header>
<nav>
  <button data-page="start"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Neues Bild</button>
  <button data-page="projects"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Projekte</button>
  <div class="sp"></div><small>Bilder kannst du auch einfach ins Fenster ziehen.</small>
</nav>
<main id="main"></main>
<script src="/kit/i18n.js"></script>
<script src="/kit/kit.js"></script>
<script>
const {$,esc,api,size,num}=Kit;const T=s=>Kit.t(s);
let page='start',projects=[],cur=null,AI={ready:false},timer=null,outDir='',bg='';
const FILTER='Bilder|*.png;*.jpg;*.jpeg;*.gif';
const IC={hand:'<svg viewBox="0 0 24 24"><path d="M8 13V5.500a1.500 1.500 0 0 1 3 0V12m0-6.500v-1a1.500 1.500 0 0 1 3 0V12m0-5.500a1.500 1.500 0 0 1 3 0V16a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.700L3.300 16a1.600 1.600 0 0 1 2.600-1.900L8 16"/></svg>',
 keep:'<svg viewBox="0 0 24 24"><path d="M4 20c3 0 4-1.500 4-3.500L17.500 7a2.100 2.100 0 0 0-3-3L5 13.500C3 13.500 2 15 2 17"/><path d="M19 15v6M16 18h6"/></svg>',
 del:'<svg viewBox="0 0 24 24"><path d="M4 20c3 0 4-1.500 4-3.500L17.500 7a2.100 2.100 0 0 0-3-3L5 13.500C3 13.500 2 15 2 17"/><path d="M16 18h6"/></svg>',
 ring:'<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2" stroke-dasharray="3 3"/><circle cx="12" cy="11" r="2.500"/><path d="M8 17c.500-2 2-3 4-3s3.500 1 4 3"/></svg>',
 undo:'<svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4 12h10a6 6 0 0 1 0 12"/></svg>',redo:'<svg viewBox="0 0 24 24"><path d="m15 7 5 5-5 5M20 12H10a6 6 0 0 0 0 12"/></svg>'};

async function refresh(){projects=await api('api/projects')}
async function aiState(){AI=await api('api/ai')}
function nav(){document.querySelectorAll('nav [data-page]').forEach(b=>b.classList.toggle('on',b.dataset.page===page||(page==='work'&&b.dataset.page==='projects')))}
const stText=p=>p.status==='ready'?T('Fertig'):p.status==='error'?T('Fehler'):p.status==='running'?T('KI arbeitet …')+' '+Math.round(p.done*100)+' %':T('Wartet');

function viewStart(msg){leave();page='start';nav();
 $('#main').innerHTML=`<div class="start"><div class="hero"><div class="pv" style="--c:#e0449a"><img src="logo.svg" alt=""></div><div class="body"><h2>Hintergrund entfernen</h2><p>Ziehe ein oder mehrere Bilder in dieses Fenster. Die KI erkennt das Motiv und stellt es frei – mit feinen Kanten bei Haaren und Fell. Danach kannst du mit dem Pinsel nachbessern.</p>
 <div class="acts"><button class="btn primary" id="pick2">Bilder öffnen</button></div>${msg?`<p class="err" style="margin:14px 0 0">${esc(msg)}</p>`:''}${aiNote()}<div class="hint">PNG, JPG oder GIF in jeder Größe, auch mehrere auf einmal</div></div></div></div>`}
function aiNote(){return AI.ready?'':AI.loading?`<div class="line" style="margin-top:14px"><div>KI wird eingerichtet<small>Einmalig, etwa 170 MB. Danach arbeitet die KI ohne Internet.</small><div class="bar"><i id="aibar" style="width:${Math.round(AI.done*100)}%"></i></div></div></div>`:AI.error?`<div class="line" style="margin-top:14px"><div>KI konnte nicht eingerichtet werden<small class="err">${esc(AI.error)}</small></div><button class="btn primary" id="aiinstall">Nochmal versuchen</button></div>`:''}

function viewProjects(){leave();page='projects';nav();
 const done=projects.filter(p=>p.status==='ready').length;
 $('#main').innerHTML=`<div class="head"><h2>Projekte</h2><span>${projects.length} insgesamt</span><div style="flex:1"></div>${done>1?`<button class="btn" id="saveall">${esc(T('Alle fertigen speichern'))} (${done})</button>`:''}</div>${aiNote()}
 <div class="pgrid">${projects.map(p=>`<button class="proj" data-id="${p.id}"><div class="pth checker"><img src="api/img?id=${p.id}&k=thumb&v=${p.ver}" alt="" loading="lazy"><span class="st" data-st="${p.id}">${esc(stText(p))}</span></div><div class="tx"><div class="tr"><b translate="no">${esc(p.name)}</b></div><span>${esc(p.detail||'')}</span><i class="open">Öffnen</i></div><span class="del" data-del="${p.id}" title="Aus der Liste entfernen">Entfernen</span></button>`).join('')||'<div class="empty">Noch keine Projekte. Öffne ein Bild, dann erscheint es hier.</div>'}</div>`;
 watchList()}
function watchList(){clearInterval(timer);timer=setInterval(async()=>{if(page!=='projects'){clearInterval(timer);return}const was=projects.map(p=>p.status+p.ver).join();await refresh();if(projects.map(p=>p.status+p.ver).join()!==was)return viewProjects();for(const p of projects){const el=document.querySelector(`[data-st="${p.id}"]`);if(el)el.textContent=stText(p)}if(!projects.some(p=>p.status==='running'||p.status==='waiting')){clearInterval(timer)}},900)}

async function openPaths(ps){ps=ps.filter(p=>/\.(png|jpe?g|gif)$/i.test(p));if(!ps.length)return Kit.toast(T('Bitte Bilddateien (PNG, JPG oder GIF) verwenden.'));
 try{const pr=await api('api/open',{paths:ps});await refresh();if(pr.length===1)show(pr[0]);else viewProjects()}catch(e){viewStart(e.message)}}
Kit.onDrop(paths=>openPaths(paths));

// ---------- Bearbeiten ----------
const ED={img:null,maskC:null,colorC:null,outC:null,ovC:null,zoom:1,px:0,py:0,tool:'keep',size:60,view:'result',undo:[],redo:[],dirty:false,saveT:null,saving:false,strokeN:0,cursor:null,rect:null,loaded:false,ver:-1};
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const load=src=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>no(new Error(T('Das Bild ließ sich nicht laden.')));im.src=src});
function leave(){clearInterval(timer);timer=null;if(ED.dirty)flush();ED.loaded=false;cur=page==='work'?null:cur}

function show(p){leave();cur=p;page='work';nav();outDir=p.outDir;bg=p.bg||'';ED.undo=[];ED.redo=[];ED.loaded=false;ED.view='result';ED.ver=-1;renderWork();poll()}

function renderWork(){const p=cur;
 $('#main').innerHTML=`<div class="head"><h2 translate="no">${esc(p.name)}</h2><span>${num(p.w)} × ${num(p.h)} Pixel</span></div>
 <div class="work"><div>
  <div class="tbar">
   <div class="seg" id="tools">${[['hand','Verschieben',IC.hand,'H'],['keep','Behalten',IC.keep,'B'],['del','Entfernen',IC.del,'E'],['ring','Motiv einkreisen',IC.ring,'M']].map(([k,n,i,key])=>`<button class="btn ${ED.tool===k?'on':''}" data-tool="${k}" title="${esc(T(n))} (${key})">${i}${esc(T(n))}</button>`).join('')}</div>
   <label id="szl">${esc(T('Pinselgröße'))}<input type="range" id="bsize" min="6" max="300" value="${ED.size}"></label>
   <div class="grow"></div>
   <span class="ur"><button class="btn" id="undo" title="${esc(T('Rückgängig'))} (Strg+Z)" aria-label="${esc(T('Rückgängig'))}">${IC.undo}</button><button class="btn" id="redo" title="${esc(T('Wiederholen'))} (Strg+Y)" aria-label="${esc(T('Wiederholen'))}">${IC.redo}</button></span>
  </div>
  <div class="stage" id="stage"><canvas id="cv"></canvas><div id="bcur" class="bcur" hidden></div><span class="tag" id="vtag" hidden></span><div class="wait"><div><span id="waittx"></span><div class="bar"><i id="waitbar" style="width:0%"></i></div></div></div></div>
  <div class="hintline" id="hint"></div>
 </div>
 <div>
  <div class="sec"><h3>Ansicht</h3>
   <div class="seg" id="views" style="margin-bottom:4px">${[['result','Ergebnis'],['original','Original'],['mask','Maske']].map(([k,n])=>`<button class="btn ${ED.view===k?'on':''}" data-view="${k}">${esc(T(n))}</button>`).join('')}</div>
  </div>
  <div class="sec"><h3>Hintergrund</h3>
   <div class="swatches" id="bgs"></div>
   <div class="line"><div>Dateiformat<small id="fmt"></small></div></div>
   <div class="line"><div>Speichern in<small title="${esc(outDir)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" translate="no">${esc(outDir)}</small></div><button class="btn" id="pickdir">Ändern</button></div>
  </div>
  <button class="btn primary big" id="save">Freigestelltes Bild speichern</button>
  <div class="two" style="margin-top:8px"><button class="btn" id="dl">Herunterladen</button><button class="btn" id="recalc">Neu berechnen</button></div>
  <div id="status"></div>
 </div></div>`;
 paintBg();setHint();bindStage();if(p.result)showDone(p.result,p.bytes)}
const BGS=[['','Durchsichtig'],['#ffffff','Weiß'],['#000000','Schwarz'],['#00b140','Grün']];
function paintBg(){const custom=bg&&!BGS.some(b=>b[0]===bg);
 $('#bgs').innerHTML=BGS.map(([c,n])=>`<button class="sw ${c?'':'checker'} ${bg===c?'on':''}" data-bg="${c}" title="${esc(T(n))}" style="${c?`background:${c}`:''}"></button>`).join('')+`<label class="sw pick ${custom?'on':''}" title="${esc(T('Eigene Farbe'))}" style="${custom?`background:${bg}`:''}"><input type="color" id="bgc" value="${custom?bg:'#7c6cff'}"></label>`;
 $('#fmt').textContent=bg?T('JPG mit farbigem Hintergrund'):T('PNG mit durchsichtigem Hintergrund');draw()}
function setHint(){const h={hand:'Ziehen verschiebt das Bild, das Mausrad zoomt.',keep:'Male über Stellen, die zum Motiv gehören und fehlen.',del:'Male über Stellen, die weg sollen.',ring:'Ziehe einen Rahmen um das Motiv. Die KI stellt dann nur dieses frei. Mit Umschalt wird es zum bisherigen Ergebnis hinzugefügt.'}[ED.tool];
 const el=$('#hint');if(el)el.textContent=T(h);const s=$('#szl');if(s)s.style.visibility=ED.tool==='keep'||ED.tool==='del'?'visible':'hidden'}

async function loadEditor(){const p=cur;if(!p||p.status!=='ready')return;const id=p.id,v=p.ver;
 try{const [img,fg,mask]=await Promise.all([load(`api/img?id=${id}&k=view&v=${v}`),load(`api/img?id=${id}&k=fg&v=${v}`),load(`api/img?id=${id}&k=mask&v=${v}`)]);
  if(!cur||cur.id!==id)return;const w=img.naturalWidth,h=img.naturalHeight;
  ED.img=img;ED.colorC=mk(w,h);ED.colorC.getContext('2d').drawImage(fg,0,0);
  setMask(mask);ED.outC=mk(w,h);ED.ovC=mk(w,h);const first=!ED.loaded;ED.loaded=true;ED.ver=v;if(first)fit();compose();draw()}catch(e){Kit.toast(e.message)}}
// Graustufenbild -> Maske im Alphakanal
function setMask(mask){const w=mask.naturalWidth||mask.width,h=mask.naturalHeight||mask.height;const c=mk(w,h),x=c.getContext('2d',{willReadFrequently:true});x.drawImage(mask,0,0);const d=x.getImageData(0,0,w,h),a=d.data;for(let i=0;i<a.length;i+=4){a[i+3]=a[i];a[i]=a[i+1]=a[i+2]=255}x.putImageData(d,0,0);ED.maskC=c}
function compose(){if(!ED.loaded)return;const x=ED.outC.getContext('2d');x.globalCompositeOperation='copy';x.drawImage(ED.colorC,0,0);x.globalCompositeOperation='destination-in';x.drawImage(ED.maskC,0,0);x.globalCompositeOperation='source-over';
 const o=ED.ovC.getContext('2d');o.globalCompositeOperation='copy';o.fillStyle='rgba(255,40,90,.6)';o.fillRect(0,0,ED.ovC.width,ED.ovC.height);o.globalCompositeOperation='destination-out';o.drawImage(ED.maskC,0,0);o.globalCompositeOperation='source-over'}
function fit(){const st=$('#stage');if(!st||!ED.img)return;const W=st.clientWidth,H=st.clientHeight,w=ED.img.naturalWidth,h=ED.img.naturalHeight;ED.zoom=Math.min((W-40)/w,(H-40)/h);ED.px=(W-w*ED.zoom)/2;ED.py=(H-h*ED.zoom)/2}
function draw(){const cv=$('#cv'),st=$('#stage');if(!cv||!st)return;const dpr=window.devicePixelRatio||1,W=st.clientWidth,H=st.clientHeight;if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
 const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);const tag=$('#vtag');
 if(!ED.loaded){if(tag)tag.hidden=true;return}
 const w=ED.img.naturalWidth,h=ED.img.naturalHeight,z=ED.zoom;x.imageSmoothingQuality='high';x.imageSmoothingEnabled=z<3;
 x.save();x.translate(ED.px,ED.py);x.scale(z,z);
 const holdOrig=ED.peek;const v=holdOrig?'original':ED.view;
 if(v==='result'){if(bg){x.fillStyle=bg;x.fillRect(0,0,w,h)}else{x.restore();x.save();x.beginPath();x.rect(ED.px,ED.py,w*z,h*z);x.clip();x.fillStyle=checker(x);x.fillRect(ED.px,ED.py,w*z,h*z);x.restore();x.save();x.translate(ED.px,ED.py);x.scale(z,z)}x.drawImage(ED.outC,0,0)}
 else if(v==='original'){x.drawImage(ED.img,0,0)}
 else{x.drawImage(ED.img,0,0);x.drawImage(ED.ovC,0,0)}
 x.restore();
 // Bildrand
 x.strokeStyle='#ffffff30';x.lineWidth=1;x.strokeRect(Math.round(ED.px)-.5,Math.round(ED.py)-.5,Math.round(w*z)+1,Math.round(h*z)+1);
 if(ED.rect){const r=ED.rect;x.setLineDash([6,4]);x.strokeStyle='#fff';x.lineWidth=1.5;x.strokeRect(r.x0,r.y0,r.x1-r.x0,r.y1-r.y0);x.setLineDash([]);x.fillStyle='rgba(124,108,255,.18)';x.fillRect(r.x0,r.y0,r.x1-r.x0,r.y1-r.y0)}
 if(tag){tag.hidden=v==='result';tag.textContent=v==='original'?T('Original'):T('Rot = wird entfernt')}}
let chk=null;function checker(x){if(!chk){const c=mk(24,24),g=c.getContext('2d');g.fillStyle='#3b3b44';g.fillRect(0,0,24,24);g.fillStyle='#55555f';g.fillRect(0,0,12,12);g.fillRect(12,12,12,12);chk=c}return x.createPattern(chk,'repeat')}
let raf=0;const redraw=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;if(ED.needC){ED.needC=false;compose()}draw();curUpd()})};
// Pinselkreis als eigenes Element: folgt der Maus sofort, ohne das Bild neu zu zeichnen
function curUpd(){const c=document.getElementById('bcur');if(!c)return;const on=ED.cursor&&ED.loaded&&(ED.tool==='keep'||ED.tool==='del');c.hidden=!on;if(!on)return;
 const d=Math.max(4,ED.size*ED.zoom);c.style.width=c.style.height=d+'px';c.style.transform=`translate(${ED.cursor.x-d/2}px,${ED.cursor.y-d/2}px)`;c.className=ED.tool==='keep'?'bcur keep':'bcur del'}

// Pinselstrich: weiche Tupfer entlang des Wegs
function dab(ix,iy){const r=ED.size/2,keep=ED.tool==='keep';const m=ED.maskC.getContext('2d');const g=m.createRadialGradient(ix,iy,r*.55,ix,iy,r);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(1,'rgba(255,255,255,0)');
 m.globalCompositeOperation=keep?'source-over':'destination-out';m.fillStyle=g;m.beginPath();m.arc(ix,iy,r,0,7);m.fill();m.globalCompositeOperation='source-over';
 if(keep){// neu behaltene Stellen zeigen die Farben des Originals
  const s=Math.ceil(r*2)+2,t=dab.t&&dab.t.width===s?dab.t:(dab.t=mk(s,s)),tx=t.getContext('2d');tx.globalCompositeOperation='copy';const g2=tx.createRadialGradient(s/2,s/2,r*.55,s/2,s/2,r);g2.addColorStop(0,'rgba(255,255,255,1)');g2.addColorStop(1,'rgba(255,255,255,0)');tx.fillStyle=g2;tx.fillRect(0,0,s,s);
  tx.globalCompositeOperation='source-in';tx.drawImage(ED.img,Math.round(ix-s/2),Math.round(iy-s/2),s,s,0,0,s,s);ED.colorC.getContext('2d').drawImage(t,Math.round(ix-s/2),Math.round(iy-s/2))}}
const toImg=e=>{const r=$('#stage').getBoundingClientRect();const sx=e.clientX-r.left,sy=e.clientY-r.top;return{sx,sy,ix:(sx-ED.px)/ED.zoom,iy:(sy-ED.py)/ED.zoom}};
function snapshot(){const c=mk(ED.maskC.width,ED.maskC.height);c.getContext('2d').drawImage(ED.maskC,0,0);return new Promise(ok=>c.toBlob(b=>ok(b),'image/png'))}
async function pushUndo(){const b=await snapshot();ED.undo.push(b);if(ED.undo.length>30)ED.undo.shift();ED.redo=[]}
async function restore(blob){const im=await createImageBitmap(blob);const c=mk(im.width,im.height);c.getContext('2d').drawImage(im,0,0);ED.maskC=c;compose();draw();markDirty()}
async function undo(){if(!ED.loaded||!ED.undo.length)return Kit.toast(T('Nichts zum Rückgängigmachen.'));ED.redo.push(await snapshot());await restore(ED.undo.pop())}
async function redo(){if(!ED.loaded||!ED.redo.length)return;ED.undo.push(await snapshot());await restore(ED.redo.pop())}
function markDirty(){ED.dirty=true;ED.strokeN++;clearTimeout(ED.saveT);ED.saveT=setTimeout(flush,1400);const s=$('#status');if(s&&s.querySelector('.res'))s.innerHTML=''}
// Maske zum Programm schicken; es rechnet die Randfarben neu
async function flush(){clearTimeout(ED.saveT);if(!ED.dirty||!ED.loaded||!cur||ED.saving)return;ED.saving=true;ED.dirty=false;const id=cur.id,n=ED.strokeN;
 try{const blob=await snapshot();const r=await fetch(`api/mask?id=${id}`,{method:'POST',body:blob});const j=await r.json();if(!r.ok)throw new Error(j.error||j.message||'Fehler');
  if(cur&&cur.id===id){cur.ver=j.ver;ED.ver=j.ver;cur.result='';if(n===ED.strokeN&&!ED.drawing){const fg=await load(`api/img?id=${id}&k=fg&v=${j.ver}`);if(cur&&cur.id===id&&n===ED.strokeN&&!ED.drawing){ED.colorC.getContext('2d').drawImage(fg,0,0);compose();draw()}}}}
 catch(e){ED.dirty=true;Kit.toast(e.message)}ED.saving=false;if(ED.dirty)ED.saveT=setTimeout(flush,800)}

function bindStage(){const st=$('#stage');let mode=null,last=null,pan=null,space=false;
 st.addEventListener('pointerdown',async e=>{if(!ED.loaded||e.button>1)return;st.setPointerCapture(e.pointerId);const p=toImg(e);
  if(e.button===1||ED.tool==='hand'||ED.space){mode='pan';pan={x:e.clientX,y:e.clientY,px:ED.px,py:ED.py};st.style.cursor='grabbing';return}
  if(ED.tool==='ring'){mode='ring';ED.rect={x0:p.sx,y0:p.sy,x1:p.sx,y1:p.sy,add:e.shiftKey};return}
  mode='paint';ED.drawing=true;last=p;const u=pushUndo();dab(p.ix,p.iy);ED.needC=true;redraw();await u});
 st.addEventListener('pointermove',e=>{const p=toImg(e);ED.cursor={x:p.sx,y:p.sy};curUpd();if(!mode)return;
  if(mode==='pan'){ED.px=pan.px+e.clientX-pan.x;ED.py=pan.py+e.clientY-pan.y}
  else if(mode==='ring'){ED.rect.x1=p.sx;ED.rect.y1=p.sy}
  else if(mode==='paint'){const dx=p.ix-last.ix,dy=p.iy-last.iy,d=Math.hypot(dx,dy),step=Math.max(1,ED.size/8);if(d>=step){for(let s=step;s<=d;s+=step)dab(last.ix+dx*s/d,last.iy+dy*s/d);last=p;ED.needC=true}}
  redraw()});
 const end=async e=>{const m=mode;mode=null;st.style.cursor='';
  if(m==='paint'){ED.drawing=false;markDirty()}
  if(m==='ring'){const r=ED.rect;ED.rect=null;redraw();if(!r)return;const a=(v,o,n)=>Math.min(1,Math.max(0,(v-o)/ED.zoom/n));const w=ED.img.naturalWidth,h=ED.img.naturalHeight;
   const x0=a(Math.min(r.x0,r.x1),ED.px,w),x1=a(Math.max(r.x0,r.x1),ED.px,w),y0=a(Math.min(r.y0,r.y1),ED.py,h),y1=a(Math.max(r.y0,r.y1),ED.py,h);
   if((x1-x0)*w<16||(y1-y0)*h<16)return Kit.toast(T('Ziehe einen größeren Rahmen um das Motiv.'));await ring(x0,y0,x1-x0,y1-y0,r.add||e.shiftKey)}};
 st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);
 st.addEventListener('pointerleave',()=>{ED.cursor=null;curUpd()});
 st.addEventListener('wheel',e=>{if(!ED.loaded)return;e.preventDefault();const p=toImg(e);const k=Math.exp(-e.deltaY*.0015),z=Math.min(16,Math.max(.05,ED.zoom*k));ED.px=p.sx-p.ix*z;ED.py=p.sy-p.iy*z;ED.zoom=z;redraw()},{passive:false});
 st.addEventListener('dblclick',()=>{if(ED.tool==='hand'){fit();redraw()}});
 new ResizeObserver(()=>redraw()).observe(st)}
async function ring(x,y,w,h,add){const st=$('#stage');if(ED.dirty){await flush()}await pushUndo();busy(true,T('KI stellt das eingekreiste Motiv frei …'),.5);
 try{const j=await api('api/region',{id:cur.id,x,y,w,h,mode:add?'add':'replace'});cur.ver=j.ver;cur.result='';await loadEditor();$('#status').innerHTML=''}catch(e){ED.undo.pop();Kit.toast(e.message)}busy(false)}
function busy(on,tx,done){const st=$('#stage');if(!st)return;st.classList.toggle('busy',!!on);if(on){$('#waittx').textContent=tx||'';$('#waitbar').style.width=Math.round((done||0)*100)+'%'}}

// Stand des Projekts abfragen, solange die KI rechnet
function poll(){clearInterval(timer);const id=cur.id;const tick=async()=>{if(!cur||cur.id!==id||page!=='work'){clearInterval(timer);return}
  if(cur.status==='ready'){busy(false);clearInterval(timer);timer=null;if(!ED.loaded||ED.ver!==cur.ver)await loadEditor();return}
  if(cur.status==='error'){busy(false);clearInterval(timer);timer=null;$('#status').innerHTML=`<p class="err">${esc(T(cur.error||'Unbekannter Fehler'))}</p>`;return}
  if(!AI.ready){await aiState();busy(true,AI.loading?T('KI wird eingerichtet (einmalig, etwa 170 MB) …'):AI.error?T('Die KI fehlt noch'):T('KI wird eingerichtet (einmalig, etwa 170 MB) …'),AI.done||0);if(AI.error){$('#status').innerHTML=`<p class="err">${esc(AI.error)}</p><button class="btn" id="aiinstall">Nochmal versuchen</button>`}}
  else busy(true,cur.status==='waiting'?T('Wartet auf die KI …'):T('KI stellt das Motiv frei …'),cur.done||0);
  try{cur=await api('api/project?id='+id);if(cur.status==='error'&&/KI-Modell fehlt|Laufzeit/.test(cur.error||'')&&!AI.ready){/* wartet auf die Einrichtung */}}catch(e){}};
 tick();timer=setInterval(tick,700)}

function showDone(path,bytes){$('#status').innerHTML=`<div class="sec res" style="margin-top:14px"><h3>Gespeichert</h3><div class="line"><div translate="no">${esc(Kit.base(path))}<small>${bytes?size(bytes):''}</small></div><button class="btn" id="showres" data-p="${esc(path)}">Im Ordner zeigen</button></div></div>`}
async function save(download){if(!cur||cur.status!=='ready')return;if(ED.dirty||ED.saving){await flush();while(ED.saving)await new Promise(r=>setTimeout(r,100))}
 const b=$(download?'#dl':'#save');b.disabled=true;const old=b.textContent;b.textContent=T('Wird gespeichert …');
 try{const r=await api('api/export',{id:cur.id,bg,format:bg?'jpg':'png',outDir,download});cur.result=r.path;showDone(r.path,r.bytes);Kit.toast(T(download?'In den Downloads-Ordner gespeichert.':'Gespeichert.'))}catch(e){$('#status').innerHTML=`<p class="err">${esc(e.message)}</p>`}
 b.disabled=false;b.textContent=old}

let installing=false;
async function installAI(){if(installing)return;installing=true;try{await api('api/ai',{})}catch(e){}await aiState();
 const iv=setInterval(async()=>{await aiState();const b=$('#aibar');if(b)b.style.width=Math.round(AI.done*100)+'%';if(!AI.loading){clearInterval(iv);installing=false;if(page==='start')viewStart();if(page==='projects')viewProjects();if(AI.ready){/* wartende Bilder neu anstoßen */await refresh();for(const p of projects)if(p.status==='error'&&/KI/.test(p.error||''))await api('api/reset?id='+p.id);if(page==='work'&&cur){cur=await api('api/project?id='+cur.id);poll()}}}},700)}

const setTool=t=>{ED.tool=t;document.querySelectorAll('#tools [data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===t));setHint();redraw()};
const HK=Kit.hotkeys('cutout',[
 ['undo','Bearbeiten','Rückgängig',['Ctrl+Z'],undo],['redo','Bearbeiten','Wiederholen',['Ctrl+Y','Ctrl+Shift+Z'],redo],
 ['open','Datei','Bilder öffnen',['Ctrl+O'],async()=>{const p=await Kit.pick('files',FILTER);if(p.length)openPaths(p)}],
 ['save','Datei','Freigestelltes Bild speichern',['Ctrl+Enter'],()=>{if(page==='work')save(false)}],
 ['hand','Werkzeug','Verschieben',['H'],()=>setTool('hand')],['keep','Werkzeug','Behalten',['B'],()=>setTool('keep')],['del','Werkzeug','Entfernen',['E'],()=>setTool('del')],['ring','Werkzeug','Motiv einkreisen',['M'],()=>setTool('ring')],
 ['smaller','Werkzeug','Pinsel kleiner',['['],()=>{ED.size=Math.max(6,Math.round(ED.size*.8));const s=$('#bsize');if(s)s.value=ED.size;redraw()}],['bigger','Werkzeug','Pinsel größer',[']'],()=>{ED.size=Math.min(300,Math.round(ED.size*1.25)+1);const s=$('#bsize');if(s)s.value=ED.size;redraw()}],
 ['fit','Ansicht','Einpassen',['0'],()=>{fit();redraw()}],
 ['projects','Ansicht','Zu den Projekten',['Esc'],()=>{if(!document.querySelector('#modal.show'))viewProjects()}],
 ['keys','Hilfe','Tastenkürzel',['F1'],()=>HK.editor()]]);
if(location.hash==='#keys')setTimeout(()=>HK.editor(),300);
// Leertaste gedrückt halten: verschieben. Taste „O“ gedrückt halten: Original ansehen.
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.code==='Space'){ED.space=true;e.preventDefault()}if(e.key==='o'||e.key==='O'){if(!ED.peek){ED.peek=true;redraw()}}});
addEventListener('keyup',e=>{if(e.code==='Space')ED.space=false;if(e.key==='o'||e.key==='O'){ED.peek=false;redraw()}});
document.addEventListener('input',e=>{if(e.target.id==='bsize'){ED.size=+e.target.value;const st=$('#stage');if(st&&!ED.cursor)ED.cursor={x:st.clientWidth/2,y:st.clientHeight/2};redraw()}if(e.target.id==='bgc'){bg=e.target.value;draw();const l=e.target.closest('.sw');document.querySelectorAll('#bgs .sw').forEach(s=>s.classList.remove('on'));l.classList.add('on');l.style.background=bg;$('#fmt').textContent=T('JPG mit farbigem Hintergrund')}});
document.addEventListener('click',async e=>{const t=e.target;let el;
 try{
 if(t.closest('#pick')||t.closest('#pick2')){const p=await Kit.pick('files',FILTER);if(p.length)openPaths(p);return}
 if(el=t.closest('[data-del]')){e.stopPropagation();await api('api/delete?id='+el.dataset.del);await refresh();return viewProjects()}
 if(el=t.closest('[data-page]')){await refresh();return el.dataset.page==='start'?viewStart():viewProjects()}
 if(el=t.closest('.proj')){const p=projects.find(x=>x.id===el.dataset.id);if(p)show(p);return}
 if(el=t.closest('[data-tool]'))return setTool(el.dataset.tool);
 if(el=t.closest('[data-view]')){ED.view=el.dataset.view;document.querySelectorAll('#views [data-view]').forEach(b=>b.classList.toggle('on',b===el));return draw()}
 if(el=t.closest('[data-bg]')){bg=el.dataset.bg;return paintBg()}
 if(t.closest('#undo'))return undo();if(t.closest('#redo'))return redo();
 if(t.closest('#aiinstall'))return installAI();
 if(t.closest('#pickdir')){const p=await Kit.pick('folder');if(p[0]){outDir=p[0];const s=t.closest('.line').querySelector('small');s.textContent=outDir;s.title=outDir}return}
 if(t.closest('#save'))return save(false);if(t.closest('#dl'))return save(true);
 if(t.closest('#recalc')){if(!cur)return;ED.undo=[];ED.redo=[];ED.dirty=false;clearTimeout(ED.saveT);await api('api/reset?id='+cur.id);cur=await api('api/project?id='+cur.id);$('#status').innerHTML='';return poll()}
 if(el=t.closest('#showres'))return Kit.openFolder(el.dataset.p);
 if(t.closest('#saveall')){const b=t.closest('#saveall');b.disabled=true;let n=0;for(const p of projects.filter(p=>p.status==='ready')){try{await api('api/export',{id:p.id,bg:p.bg||'',format:p.bg?'jpg':'png',outDir:p.outDir});n++}catch(x){Kit.toast(p.name+': '+x.message)}b.textContent=`${n} …`}Kit.toast(n+' '+T('Bilder gespeichert (jeweils neben dem Original).'));await refresh();return viewProjects()}
 }catch(x){Kit.toast(x.message)}
});
Promise.all([refresh(),aiState()]).then(()=>{if(!AI.ready&&!AI.error)installAI();projects.length?viewProjects():viewStart()});
</script>
</body>
